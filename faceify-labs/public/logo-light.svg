<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="primarySage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d6358;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c6f;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a855;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Precision Node Icon -->
  <g id="node_icon">
    <!-- Central node cluster -->
    <circle cx="120" cy="200" r="9" fill="#0a0f1a"/>

    <!-- Surrounding precision nodes -->
    <circle cx="75" cy="160" r="6" fill="#4a7c6f"/>
    <circle cx="165" cy="160" r="6" fill="#4a7c6f"/>
    <circle cx="190" cy="215" r="6" fill="#4a7c6f"/>
    <circle cx="160" cy="260" r="6" fill="#4a7c6f"/>
    <circle cx="80" cy="260" r="6" fill="#4a7c6f"/>
    <circle cx="50" cy="215" r="6" fill="#4a7c6f"/>

    <!-- Outer anchor points -->
    <circle cx="50" cy="135" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="190" cy="135" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="220" cy="200" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="220" cy="250" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="120" cy="295" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="20" cy="250" r="4.5" fill="#6b9e8f" opacity="0.7"/>
    <circle cx="20" cy="200" r="4.5" fill="#6b9e8f" opacity="0.7"/>

    <!-- Connection mesh -->
    <line x1="75" y1="160" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>
    <line x1="165" y1="160" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>
    <line x1="190" y1="215" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>
    <line x1="160" y1="260" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>
    <line x1="80" y1="260" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>
    <line x1="50" y1="215" x2="120" y2="200" stroke="#4a7c6f" stroke-width="2.5" opacity="0.6"/>

    <!-- Outer mesh connections -->
    <line x1="75" y1="160" x2="50" y2="135" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>
    <line x1="165" y1="160" x2="190" y2="135" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>
    <line x1="190" y1="215" x2="220" y2="200" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="260" x2="220" y2="250" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>
    <line x1="80" y1="260" x2="20" y2="250" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="215" x2="20" y2="200" stroke="#6b9e8f" stroke-width="1.5" opacity="0.4"/>

    <!-- Triangulation lines -->
    <line x1="75" y1="160" x2="165" y2="160" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
    <line x1="165" y1="160" x2="190" y2="215" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
    <line x1="190" y1="215" x2="160" y2="260" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
    <line x1="160" y1="260" x2="80" y2="260" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
    <line x1="80" y1="260" x2="50" y2="215" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="215" x2="75" y2="160" stroke="url(#accentGold)" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Typography -->
  <text x="280" y="210" font-family="'Inter', -apple-system, sans-serif"
        font-size="90" font-weight="600" fill="#0a0f1a" letter-spacing="-3">faceify</text>
  <text x="280" y="260" font-family="'Inter', -apple-system, sans-serif"
        font-size="34" font-weight="300" fill="#4a7c6f" letter-spacing="9">labs</text>
</svg>
